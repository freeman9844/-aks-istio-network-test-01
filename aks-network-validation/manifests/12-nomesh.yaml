# 사이드카 없는 클라이언트. STRICT mTLS 가 평문 요청을 막는지 확인할 때 쓴다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: nomesh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: nomesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: probe
      containers:
        - name: app
          image: nicolaka/netshoot:v0.13
          command: ["socat"]
          args:
            - TCP-LISTEN:8080,fork,reuseaddr
            - 'SYSTEM:"printf ''HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok''"'
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
