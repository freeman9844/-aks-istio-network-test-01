apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-a
  namespace: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-a
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-a
  template:
    metadata:
      labels:
        app: web-a
        tier: web
    spec:
      serviceAccountName: web-a
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web-a
      containers:
        - name: app
          image: nicolaka/netshoot:v0.13
          command: ["socat"]
          args:
            - TCP-LISTEN:8080,fork,reuseaddr
            - 'SYSTEM:"printf ''HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok''"'
          ports:
            - containerPort: 8080
          # STRICT mTLS 에서도 kubelet 이 확인할 수 있도록 Istio 가 15020 /app-health/ 로 rewrite (T14)
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-a
  namespace: web
spec:
  selector:
    app: web-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
