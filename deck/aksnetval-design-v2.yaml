          - {kind: text, name: z3-max, x: 1046, y: 248, w: 145, h: 60, text: "범위 1~3대\n확장 후 2대", size: 11, color: "666666"}
          - {kind: text, name: zone-how, x: 645, y: 335, w: 560, h: 96, text: "zone-fill: CPU requests 800m (노드 1대에 Pod 1개), 사용자 풀에만 배치\n분산 제약(topologySpread)을 일부러 넣지 않음 → CAS 설정 효과만 확인\n세 풀은 VM 크기·레이블·taint 동일 · system 풀은 별도", size: 11, color: "444444", align: left}
          - {kind: round, name: zone-pass, x: 645, y: 445, w: 560, h: 112, fill: "EAF6EC", line: "2E7D32", radius: 4}
          - {kind: text, name: zone-pass-text, x: 655, y: 450, w: 540, h: 102, text: "PASS: 모든 Pod Running 후 영역별 사용자 노드 수 최대−최소 ≤ 1\nFAIL: 15분 내 Pending이 남음 (DSv5 22 vCPU 할당량 확인)\n관찰만: zone-fill 0 → CAS 축소 시 영역 분포 (공식 보장 아님)\nPoC 필요였던 항목: 유사 그룹 인식 → 5장에서 확인", size: 11, color: "171717", align: left}
    notes: |
      앞 장 표의 마지막 두 줄, T12와 T13을 그림으로 풀어 본 장표입니다. 둘 다 시간이 10분에서 15분쯤 걸려서 따로 실행할 수 있게 해 뒀어요.
      왼쪽 HPA부터 보겠습니다. hpa-demo를 최소 5, 최대 5로 띄워 두고, minReplicas를 2로 패치합니다. 부하 없이 유휴 상태라 HPA는 2개까지 줄이려 하는데, behavior에 Pods 1개, 60초 정책을 걸어 두었기 때문에 한 번에 1개씩만 줄어야 하거든요. 그래서 막대가 5, 4, 3, 2로 내려가고 각 간격이 55초 이상이면 PASS입니다. 스크립트는 5초 간격으로 replicas와 시각을 기록합니다.
      여기서 주의할 점이 두 가지 있어요. 하나는 안정화 창 300초는 이번 검증 범위가 아니라는 겁니다. 패치 직후에 바로 축소가 시작될 수 있어서, 이 결과를 안정화 동작의 근거로 쓰시면 안 됩니다. 다른 하나는 PDB가 HPA 축소에는 적용되지 않는다는 점이죠. PDB는 드레인 같은 eviction에만 동작합니다.
      오른쪽은 영역 균형입니다. 영역 1, 2, 3에 사용자 풀을 하나씩 두고 각각 1대에서 3대로 오토스케일합니다. zone-fill Pod는 하나가 노드 한 대를 차지하도록 requests를 잡고, 분산 제약은 일부러 넣지 않습니다. 그래야 스케줄러가 아니라 CAS의 balance-similar-node-groups 효과를 볼 수 있거든요. 노드 6대로 늘어났을 때 영역별 차이가 1 이하면 PASS입니다.
      축소할 때의 영역 분포는 공식적으로 보장되는 동작이 아니라서 관찰만 하고, 영역 레이블이 다른 풀을 유사 그룹으로 인식하는지는 PoC로 확인이 필요합니다. 여기까지가 설계였고요, 다음 장부터는 이 구성을 실제 AKS에 올려서 돌려 본 결과를 보겠습니다.
    source: |
      https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior
      https://learn.microsoft.com/azure/aks/cluster-autoscaler

  - layout: content
    title: "결과 ① 네트워크 통제 — T1~T11 12건 모두 PASS"
    title_size: 26
    archetype: comparison-table
    blocks:
      - type: table
        id: net-result
        box: [40, 98, 1200, 476]
        size: 12
        symbols: false
        first_col_bold: true
        col_widths: [0.55, 2.6, 1.4, 1.1, 0.8, 3.2]
        columns: ["ID", "출발 → 대상", "기대", "실측", "판정", "근거 (실측 기록)"]
        rows:
          - ["T1", "VM-allow → 10.50.1.10:80", "200", "200", "PASS", "NSG 100 Allow · Gateway → web-a"]
          - ["T2", "VM-deny → 10.50.1.10:80", "차단", "000", "PASS", "curl rc=28 (시간 초과) · 대조군 T1·T2c 통과"]
          - ["T2c", "VM-deny → Blob :443", "연결 성공", "400", "PASS", "TLS 연결 후 HTTP 400 = 경로 정상"]
          - ["T3", "VM-allow (T1 재사용)", "200", "200", "PASS", "snet-ingress Deny가 있어도 200"]
          - ["T4", "web-a → bff-a", "200", "200", "PASS", "자기 BFF 허용"]
          - ["T5", "web-a → bff-b", "403", "403", "PASS", "SA principal 불일치 → RBAC 거부"]
          - ["T6", "web-b → bff-b", "200", "200", "PASS", "자기 BFF 허용"]
          - ["T7", "web-b → bff-a", "403", "403", "PASS", "SA principal 불일치 → RBAC 거부"]
          - ["T8", "probe (사이드카 X) → bff-a", "연결 실패", "000", "PASS", "curl rc=56 (연결 리셋) · STRICT mTLS"]
          - ["T9", "web-a → web-b (우회)", "403", "403", "PASS", "Gateway SA만 허용"]
          - ["T10", "web-a → Blob", "TLS 실패", "000", "PASS", "DNS=10.50.2.4 (PE) · curl rc=28"]
          - ["T11", "bff-a → Blob", "TLS 성공", "400", "PASS", "DNS=10.50.2.4 (PE) · TLS 연결 성공"]
      - type: callout
        id: negative
        box: [40, 590, 1200, 82]
        text: "부정 검증: NetworkPolicy(deny-web-to-data)를 지우면 T10만 FAIL로 바뀌고, 다시 적용하면 12건 모두 PASS<br>판정 원칙: curl이 실제로 실행됐을 때만 000을 차단으로 인정 · 대조군 실패 시 INCONCLUSIVE"
    notes: |
      여기서부터는 실제 결과입니다. 앞에서 본 매트릭스를 koreacentral의 AKS에 그대로 올려서 스크립트로 자동 판정한 표인데요, T1부터 T11까지 대조군 T2c를 포함해 12건이 모두 PASS였습니다.
      먼저 NSG를 보면, T1은 VM-allow에서 내부 LB로 200이 나왔고, T2는 VM-deny에서 curl 종료 코드 28, 그러니까 시간 초과로 막혔습니다. 같은 VM에서 Blob으로 TLS 연결이 되는 T2c가 통과했기 때문에, 이 차단이 VM 고장이 아니라 NSG 때문이라는 걸 말할 수 있죠. T3는 snet-ingress에 Deny 규칙이 있는데도 200이 나와서, LB IP 서브넷의 NSG는 효과가 없다는 게 확인됐습니다.
      Istio 쪽은 자기 BFF 호출이 200, 교차 호출이 403, Ingress를 우회한 web 간 호출도 403이었습니다. 사이드카가 없는 probe는 종료 코드 56, 연결 리셋으로 끊겼고요. STRICT mTLS가 평문 연결을 받지 않는다는 뜻입니다.
      NetworkPolicy는 T10과 T11을 같이 봐야 하는데요, 두 Pod 모두 Blob 이름이 PE IP 10.50.2.4로 해석된 걸 먼저 확인했고, web에서는 TLS가 실패, app에서는 성공했습니다. 아래 부정 검증처럼 NetworkPolicy를 지우면 T10만 FAIL로 바뀌었기 때문에, 차단 원인이 정확히 그 정책이라는 것까지 확인한 셈입니다. 그럼 시간이 걸리는 스케일링 결과를 다음 장에서 보겠습니다.
    source: |
      결과 파일: aks-network-validation/results/20261119-192119.md
      curl 종료 코드 28 = 시간 초과, 56 = 수신 실패(연결 리셋)

