    title: "결과 정리 — PRD 설계에 주는 의미와 남은 한계"
    title_size: 26
    archetype: comparison-table
    blocks:
      - type: table
        id: takeaways
        box: [40, 98, 1200, 300]
        size: 13
        symbols: false
        first_col_bold: true
        col_widths: [1.6, 3.4, 3.6]
        columns: ["통제", "확인된 사실 (근거)", "PRD 설계 시사점"]
        rows:
          - ["NSG", "LB IP 서브넷 NSG는 효과 없음, 노드 서브넷 NSG가 차단 (T1~T3)", "허용·차단 규칙은 노드 서브넷 NSG에 둠"]
          - ["AuthorizationPolicy", "SA principal 기준으로 교차·우회 호출 403 (T5·T7·T9)", "web↔bff 1:1 정책과 Gateway SA 제한 그대로 사용"]
          - ["STRICT mTLS", "사이드카 없는 Pod는 연결 리셋 (T8)", "비메시 워크로드는 별도 예외 설계 필요"]
          - ["NetworkPolicy", "사이드카를 거쳐도 PE 대역 차단, 정책 삭제 시 T10만 FAIL", "Tier 3 데이터 분리에 NetworkPolicy 유효"]
          - ["HPA", "Pods 1 / 60초 정책으로 61·60초 간격 축소 (T12)", "축소 속도 제한은 behavior 정책으로 구현"]
          - ["CAS 영역 균형", "영역별 풀 3개가 함께 확장, 3/2/2 (T13)", "영역별 풀 + balance-similar-node-groups 유효"]
      - type: callout
        id: limits
        box: [40, 420, 1200, 152]
        text: "남은 한계 · 기능 검증이며 성능 검증 아님 · HTTP 80만 사용(TLS 종단 미검증)<br>최종 리뷰 수정분(T3 NSG 조회, T13 판정 순서)은 단위 테스트 75개로만 확인 · 리소스 그룹은 삭제 완료(약 48분)<br>시스템 노드 1대·Gateway 기본 배치는 검증용 — PRD는 Gateway 전용 ingress 풀 권장"
    notes: |
      앞의 두 장에서 본 결과를 PRD 설계 관점으로 한 표에 모았습니다.
      첫 줄 NSG는 허용과 차단이 LB IP 서브넷이 아니라 노드 서브넷 NSG에서 걸린다는 게 확인됐으니, PRD에서도 규칙을 노드 서브넷 NSG에 두시면 됩니다. AuthorizationPolicy는 서비스 계정 기준으로 교차 호출과 우회 호출이 모두 403이 나와서, web과 bff를 1대1로 묶는 정책을 그대로 써도 되겠습니다. STRICT mTLS에서는 사이드카가 없는 Pod가 아예 연결이 끊기니까, 메시 밖 워크로드가 있다면 예외를 따로 설계해야 하고요.
      NetworkPolicy는 사이드카를 거쳐 나가는 연결도 PE 대역에서 막혔고, 정책을 지우면 T10만 바뀌었습니다. Tier 3 데이터 분리에 쓸 수 있다는 근거죠. HPA는 behavior 정책으로 축소 속도를 1분에 1개로 제한할 수 있었고, 영역별 풀 세 개와 균형 옵션 조합도 실제로 고르게 늘어났습니다.
      아래 한계도 꼭 같이 봐 주세요. 이건 기능 검증이지 성능 검증이 아니고, HTTP 80만 써서 TLS 종단은 다루지 않았습니다. 최종 리뷰에서 고친 판정 코드는 리소스를 지운 뒤라 단위 테스트로만 확인했고요. 시스템 노드 한 대에 Gateway를 둔 건 검증용 구성이라, PRD에서는 Gateway 전용 ingress 풀을 권장드립니다. 이상으로 검증 결과 공유를 마치겠습니다.
