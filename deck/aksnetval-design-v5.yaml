        columns: ["ID", "출발 → 대상", "기대", "실측", "판정", "근거 (실측 기록)"]
        rows:
          - ["T1", "vm-appgw-sim → 10.50.1.10:80", "200", "200", "PASS", "NSG 100 Allow · Gateway → web-a"]
          - ["T2", "vm-other → 10.50.1.10:80", "차단", "000", "PASS", "curl rc=28 (시간 초과) · 대조군 T1·T2c 통과"]
          - ["T2c", "vm-other → Blob PE :443", "연결 성공", "400", "PASS", "TLS 연결 후 HTTP 400 = 경로 정상"]
          - ["T3", "vm-appgw-sim (T1 재사용)", "200", "200", "PASS", "nsg-ingress Deny 규칙·서브넷 연결 확인"]
          - ["T4", "web-a → bff-a", "200", "200", "PASS", "자기 BFF 허용"]
          - ["T5", "web-a → bff-b", "403", "403", "PASS", "SA principal 불일치 → RBAC 거부"]
          - ["T6", "web-b → bff-b", "200", "200", "PASS", "자기 BFF 허용"]
          - ["T7", "web-b → bff-a", "403", "403", "PASS", "SA principal 불일치 → RBAC 거부"]
          - ["T8", "probe (사이드카 X) → bff-a", "연결 실패", "000", "PASS", "curl rc=56 (연결 리셋) · STRICT mTLS"]
          - ["T9", "web-a → web-b (우회)", "403", "403", "PASS", "Gateway SA만 허용"]
          - ["T10", "web-a → Blob PE", "TLS 실패", "000", "PASS", "DNS=10.50.2.4 (PE) · curl rc=28"]
          - ["T11", "bff-b → Blob PE", "TLS 성공", "400", "PASS", "DNS=10.50.2.4 (PE) · bff-b 전용 PE"]
          - ["T14", "kubelet → web·bff probe", "Ready", "Ready 4/4", "PASS", "15020 /app-health/app/readyz 로 rewrite 4/4"]
      - type: callout
        id: negative
        box: [40, 590, 1200, 82]
        text: "실행 위치: vm-mgmt → Private API 경유 kubectl exec · VM curl은 run-command · 표는 network 재실행 결과(전체 실행과 판정 동일)<br>판정 원칙: curl이 실제로 실행됐을 때만 000을 차단으로 인정 · DNS가 기대 PE IP일 때만 T10·T11 판정 · 대조군 실패 시 INCONCLUSIVE"
    notes: |
      여기서부터는 실제 결과입니다. 앞에서 본 매트릭스를 koreacentral의 Private AKS에 올려서, vm-mgmt 안에서 자동 판정한 표인데요. T1부터 T11까지 대조군 T2c를 포함한 12건과 T14까지 13건이 모두 PASS였습니다. 표는 network 항목만 다시 돌린 재실행 결과이고, 전체 실행과 판정이 같습니다.
      먼저 NSG를 보면, T1은 vm-appgw-sim에서 내부 LB로 200이 나왔고, T2는 vm-other에서 curl 종료 코드 28, 그러니까 시간 초과로 막혔습니다. 같은 VM에서 Blob PE로 TLS 연결이 되는 T2c가 통과했으니까, 이 차단이 VM 고장이 아니라 NSG 때문이라고 말할 수 있죠. T3는 snet-ingress에 Deny가 있는데도 200이라서, LB IP 서브넷 NSG는 효과가 없다는 게 다시 확인됐습니다.
      Istio 쪽은 자기 BFF가 200, 교차 호출과 우회 호출이 403이었고, 사이드카 없는 probe는 종료 코드 56, 연결 리셋으로 끊겼습니다.
      T10과 T11은 같이 보셔야 하는데요. 두 Pod 모두 Blob 이름이 PE IP 10.50.2.4로 해석된 걸 먼저 확인했어요. 그다음 web-a에서는 TLS가 실패, bff-b에서는 성공했습니다. Linux판에서는 이 PE가 bff-b 전용이라 출발지가 bff-b로 바뀌었어요. T14는 STRICT mTLS에서도 probe가 15020 포트로 rewrite되어 네 개 모두 Ready였습니다. 그럼 PE를 bff별로 나눈 결과를 다음 장에서 자세히 보겠습니다.
    source: |
      결과 파일: aks-network-validation-linux/results/20261120-052231.md (network 재실행), 20261120-050457.md (전체 실행)
      curl 종료 코드 28 = 시간 초과, 56 = 수신 실패(연결 리셋)
      https://learn.microsoft.com/azure/aks/private-clusters

