    blocks:
      - type: table
        id: takeaways
        box: [40, 98, 1200, 390]
        size: 11
        symbols: false
        first_col_bold: true
        col_widths: [1.6, 3.6, 3.4]
        columns: ["통제", "확인된 사실 (근거)", "PRD 설계 시사점"]
        rows:
          - ["NSG", "LB IP 서브넷 NSG는 효과 없음, 노드 서브넷 NSG가 차단 (T1~T3)", "허용·차단 규칙은 노드 서브넷 NSG에 둠"]
          - ["AuthorizationPolicy", "SA principal 기준으로 교차·우회 호출 403 (T5·T7·T9)", "web↔bff 1:1 정책과 Gateway SA 제한 그대로 사용"]
          - ["STRICT mTLS", "사이드카 없는 Pod는 연결 리셋 (T8)", "비메시 워크로드는 별도 예외 설계 필요"]
          - ["PE egress 분리", "bff별 자기 PE만 TLS 성공, 교차 000 (T10·T11·T16~T18)", "공통 정책에서 PE 대역 제외 + Pod별 /32 허용"]
          - ["기본 egress", "CoreDNS·istiod·인터넷 정상 (T19~T21)", "PE 분리 정책이 다른 통신을 끊지 않음"]
          - ["Private Cluster", "API 서버 10.50.4.4만, 로컬 NXDOMAIN (T15)", "운영은 VNet 안 관리 VM에서 run-command로"]
          - ["HPA", "Pods 1 / 60초 정책으로 61·62초 간격 축소 (T12)", "축소 속도 제한은 behavior 정책으로 구현"]
          - ["CAS 영역 균형", "세 영역 풀이 함께 확장, 노드 2/2/2 (T13)", "영역별 풀 + balance-similar-node-groups 유효"]
          - ["강제 분산 + CAS", "DoNotSchedule·minDomains 3 → Pod 2/2/2, Pending 0 (T13b)", "PRD 권장 topologySpreadConstraints 그대로 사용"]
          - ["축소 뒤 분포", "minReplicas 3으로 5→3 축소, 3회 모두 1/1/1 (T12c)", "minReplicas ≥ 영역 수, 재분산은 Descheduler"]
          - ["readinessProbe", "STRICT mTLS에서도 15020 rewrite로 Ready 4/4 (T14)", "probe 추가 시 별도 mTLS 예외 불필요"]
      - type: callout
        id: limits
        box: [40, 500, 1200, 150]
        text: "PowerShell판(17 PASS + INFO 1)과 같은 결론 + Linux판 추가 통제 T15~T21<br>PoC 필요: Cilium에서 namespaceSelector {}와 ipBlock 조합의 노드·host 엔터티 처리 방식<br>T19~T21 PASS로 기본 egress 유지만 확인 · 기능 검증(성능 아님) · HTTP 80만 사용"
    notes: |
      앞의 결과 장들을 PRD 설계 관점으로 한 표에 모았습니다. 전체로는 24건 PASS에 T12b 하나가 기록용 INFO예요.
      위쪽 세 줄은 PowerShell판과 같습니다. 허용과 차단은 노드 서브넷 NSG에서 걸리고, 서비스 계정 기준 인가로 교차와 우회 호출이 403, 사이드카 없는 Pod는 연결이 끊깁니다. 그다음 세 줄이 Linux판에서 새로 확인한 부분인데요. 공통 정책에서 PE 대역을 빼고 Pod별 /32만 다시 열어서 bff마다 자기 PE만 쓰게 만들 수 있었어요. 그래도 CoreDNS, istiod, 인터넷은 끊기지 않았습니다. Private Cluster는 API 서버가 사설 IP로만 열려서, 운영은 VNet 안 관리 VM에서 하는 형태가 그대로 동작했어요.
      스케일링 쪽은 HPA가 61초, 62초 간격으로 1개씩 줄었고, 세 영역 풀이 함께 2, 2, 2로 늘었으며, PRD의 강제 분산도 CAS와 함께 2, 2, 2를 만들었습니다. minReplicas를 영역 수로 두면 축소 뒤에도 영역마다 하나씩 남았고, probe는 따로 예외가 필요 없었습니다.
      아래 상자도 꼭 같이 봐 주세요. 결론은 PowerShell판 17 PASS와 같고 Linux판 통제가 더해진 겁니다. 다만 Cilium이 namespaceSelector 빈 값과 ipBlock 조합에서 노드나 host 엔터티를 어떻게 처리하는지는 문서로 못 닫아서 PoC가 필요해요. 기본 egress가 유지되는 것까지만 확인했다는 뜻입니다. 이상으로 Linux 관리 VM판 검증 결과 공유를 마치겠습니다. 질문 있으시면 편하게 주세요.
