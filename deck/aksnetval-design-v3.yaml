    notes: |
      앞 장의 네트워크 통제에 이어서, 이번에는 스케일링 두 가지 결과입니다.
      왼쪽 HPA부터 볼게요. minReplicas를 5에서 2로 패치하자 11초 뒤에 5에서 4로 줄었고, 이어서 63초, 57초 간격으로 3, 2까지 하나씩 내려갔습니다. 순서가 정확히 5, 4, 3, 2이고 간격이 모두 55초 기준을 넘었으니 PASS입니다. 5초 간격으로 표본을 뜨기 때문에 57초처럼 60초보다 조금 짧게 보이는 건 측정 오차 범위예요. 즉 behavior에 넣은 Pods 1개, 60초 정책이 의도대로 동작한다는 거죠. 다만 첫 감소 11초는 판정에서 뺀 관찰 값이라서, 안정화 창 300초 동작을 이걸로 설명하시면 안 됩니다.
      오른쪽은 영역 균형입니다. zone-fill Pod 6개를 800m로 띄우자 125초 만에 모두 Running이 됐고, 이번에는 세 영역 모두 1대에서 2대로 늘어 2, 2, 2가 됐습니다. 더 중요한 건 TriggeredScaleUp 이벤트 하나에 세 풀이 함께 나왔다는 점입니다. 영역 레이블이 다른 풀도 CAS가 유사 그룹으로 묶어서 같이 늘렸다는 뜻이라, 설계 때 PoC 필요로 남겼던 질문이 다시 한 번 확인됐습니다.
      첫 실행에서는 3, 2, 2였는데요, 기존 노드에 Pod가 먼저 몇 개 들어가느냐에 따라 추가 대수가 달라지기 때문입니다. 개수는 달라도 차이가 1 이하로 유지된다는 게 핵심이죠. 그럼 이번에 PRD 권장 YAML을 반영해서 새로 본 세 가지 결과를 다음 장에서 보겠습니다.
