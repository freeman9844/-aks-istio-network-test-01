    notes: |
      앞 장까지가 기존 검증의 재실행 결과였고요, 이번 장은 PRD 검토용 YAML에서 가져와 새로 넣은 세 가지 결과입니다.
      왼쪽 T13b부터 볼게요. zone-spread라는 Deployment에 PRD YAML과 같은 영역 강제 분산, 그러니까 DoNotSchedule과 minDomains 3, nodeTaintsPolicy Honor를 넣고, 노드가 영역마다 한 대인 상태에서 6개로 늘렸습니다. 처음 세 개는 기존 노드에 하나씩 들어가고, 나머지 세 개는 Pending이 됐는데요, CAS가 이걸 보고 세 영역의 풀을 한 대씩 늘려서 110초 만에 Pod가 2, 2, 2로 모두 Running이 됐습니다. 강제 분산과 CAS가 충돌 없이 같이 동작한다는 근거죠. 이벤트에는 userz3만 남았지만 노드는 세 영역 모두 늘었기 때문에 판정은 Pod와 노드 수로만 했습니다.
      가운데 T12b가 이번에 가장 의미 있는 관찰인데요. 같은 강제 분산을 건 hpa-demo를 5개에서 2개로 줄였더니, 축소 전 2, 2, 1이던 분포가 축소 뒤 1, 0, 1이 됐습니다. 영역 2에 Pod가 하나도 없죠. 분산 제약은 배치할 때만 적용되고, 축소할 때 ReplicaSet은 영역을 보지 않기 때문입니다. 그래서 PRD에서 영역마다 최소 하나를 보장하려면 minReplicas를 영역 수 이상으로 두거나 Descheduler를 검토해야 하고, 이 부분은 PoC가 필요합니다.
      오른쪽 T14는 STRICT mTLS에서 kubelet의 readinessProbe가 통과하는지입니다. kubelet은 평문으로 부르기 때문에 그대로면 막히는데, Istio가 probe를 15020 포트의 app-health 경로로 바꿔서 pilot-agent가 앱을 대신 호출합니다. 네 Pod 모두 rewrite되고 Ready였고, 별도 설정 없이 추가 기능 기본값으로 동작했습니다. 그럼 지금까지 결과를 PRD 관점으로 정리하겠습니다.
